<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--site-seo-->
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { margin: 0; background: #fcedda; color: #262223; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #262223; color: #fcedda; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-content: center;
        justify-items: center; gap: 1rem; margin: 0; text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        pointer-events: none;
      }
      html.is-ready #boot { display: none !important; }
      .boot-wait {
        margin: 0; max-width: 20rem; font-family: system-ui, sans-serif;
        font-size: clamp(1rem, 2.8vw, 1.15rem); line-height: 1.4; opacity: 0.85;
      }
      .boot-loader { width: 7.5rem; height: 7.5rem; overflow: visible; }
      .boot-ink { fill: #262223; }
      .boot-paper { fill: #fcedda; }
      .boot-smile { stroke: #262223; }
      .boot-keys { fill: #fa6e5a; }
      html[data-theme="dark"] .boot-ink { fill: #fcedda; }
      html[data-theme="dark"] .boot-paper { fill: #262223; }
      html[data-theme="dark"] .boot-smile { stroke: #fcedda; }
      .boot-bob { transform-origin: 60px 88px; animation: boot-bob 0.9s ease-in-out infinite; }
      .boot-shadow { transform-origin: 60px 104px; animation: boot-shadow 0.9s ease-in-out infinite; }
      .boot-eye { transform-box: fill-box; transform-origin: center; animation: boot-blink 2.8s step-end infinite; }
      .boot-keys rect { animation: boot-type 0.7s ease-in-out infinite; }
      .boot-keys rect:nth-child(2) { animation-delay: 0.12s; }
      .boot-keys rect:nth-child(3) { animation-delay: 0.24s; }
      .boot-dot { animation: boot-dot 1.1s ease-in-out infinite; }
      .boot-dot:nth-child(2) { animation-delay: 0.15s; }
      .boot-dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes boot-shadow {
        0%, 100% { transform: scaleX(1); opacity: 0.28; }
        50% { transform: scaleX(0.72); opacity: 0.14; }
      }
      @keyframes boot-blink {
        0%, 42%, 48%, 100% { transform: scaleY(1); }
        45% { transform: scaleY(0.12); }
      }
      @keyframes boot-type {
        0%, 100% { opacity: 0.35; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-1.5px); }
      }
      @keyframes boot-dot {
        0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bob, .boot-shadow, .boot-eye, .boot-keys rect, .boot-dot { animation: none; }
      }
    </style>
    <script>
      (function () {
        var saved = localStorage.getItem('theme')
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#262223')
      })()
    </script>
  </head>
  <body>
    <div id="boot" aria-busy="true" aria-live="polite">
      <svg class="boot-loader" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse class="boot-shadow" cx="60" cy="104" rx="28" ry="6" fill="currentColor" />
        <g class="boot-bob">
          <rect class="boot-ink" x="38" y="72" width="44" height="26" rx="6" />
          <rect class="boot-paper" x="42" y="76" width="36" height="14" rx="3" />
          <g class="boot-keys">
            <rect x="46" y="80" width="6" height="5" rx="1" />
            <rect x="56" y="80" width="6" height="5" rx="1" />
            <rect x="66" y="80" width="6" height="5" rx="1" />
          </g>
          <circle cx="60" cy="48" r="26" fill="#fa6e5a" />
          <circle class="boot-eye boot-ink" cx="51" cy="46" r="4.5" />
          <circle class="boot-eye boot-ink" cx="69" cy="46" r="4.5" />
          <circle class="boot-paper" cx="52.2" cy="44.8" r="1.4" />
          <circle class="boot-paper" cx="70.2" cy="44.8" r="1.4" />
          <path class="boot-smile" d="M52 56c3.2 4 12.8 4 16 0" fill="none" stroke-width="2.4" stroke-linecap="round" />
          <circle cx="44" cy="54" r="4" fill="#ffb4a8" opacity="0.85" />
          <circle cx="76" cy="54" r="4" fill="#ffb4a8" opacity="0.85" />
        </g>
        <g fill="currentColor" transform="translate(0 8)">
          <circle class="boot-dot" cx="48" cy="16" r="2.4" />
          <circle class="boot-dot" cx="60" cy="16" r="2.4" />
          <circle class="boot-dot" cx="72" cy="16" r="2.4" />
        </g>
      </svg>
      <p class="boot-wait" id="boot-line">Loading...</p>
      <script type="application/json" id="boot-lines">__BOOT_LINES__</script>
      <script>
        (function () {
          var node = document.getElementById('boot-lines')
          var line = document.getElementById('boot-line')
          if (!node || !line) return
          try {
            var lines = JSON.parse(node.textContent)
            if (lines && lines.length) {
              line.textContent = lines[Math.floor(Math.random() * lines.length)]
            }
          } catch (e) {}
        })()
      </script>
    </div>
    <div id="root"></div>
    <!--site-crawler-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
